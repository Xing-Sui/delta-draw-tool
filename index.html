<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    /* ======================
    后台修改这里设置背景：
    background-image: url("");
    background‑size: cover;
    background‑position: center;
    背景透明度修改下面伪元素 opacity，0~1之间
    不需要背景就把 background-image 注释掉
    ====================== */
    background-color: #ffffff;
    color: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 15px;
    overflow-x:hidden;
    position: relative;
}
/* 背景遮罩层，用来实现背景图片透明度，不要删除 */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background-image: url("./1.jpg"); /*在这里填入图片地址*/
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.9; /* 修改这个数值调整背景透明度 0完全透明 1不透明 */
}
/* ========== 波普斜向渐变放大标题：左→右字体越来越大 ========== */
h1{
    margin-bottom: 24px;
    text-align: center;
    transform: rotate(-6deg);
    display: inline-flex;
    gap: 2px;
    flex-wrap: nowrap;
}
h1 span{
    display: inline-block;
    font-weight: 900;
    color: #fff;
    text-shadow:
        3px 3px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
}
/* 每个字从左到右越来越大 */
h1 span:nth-child(1){ font-size:22px; color:#ff2255; }
h1 span:nth-child(2){ font-size:24px; color:#2244ff; }
h1 span:nth-child(3){ font-size:26px; color:#00bb44; }
h1 span:nth-child(4){ font-size:28px; color:#ff4400; }
h1 span:nth-child(5){ font-size:30px; color:#aa22ff; }
h1 span:nth-child(6){ font-size:32px; color:#ff2255; }
h1 span:nth-child(7){ font-size:34px; color:#2244ff; }
h1 span:nth-child(8){ font-size:36px; color:#00bb44; }
h1 span:nth-child(9){ font-size:38px; color:#ff4400; }
h1 span:nth-child(10){ font-size:40px; color:#aa22ff; }
h1 span:nth-child(11){ font-size:42px; color:#ff2255; }
h1 span:nth-child(12){ font-size:44px; color:#2244ff; }
h1 span:nth-child(13){ font-size:46px; color:#00bb44; }
h1 span:nth-child(14){ font-size:48px; color:#ff4400; }
/* ========== 漫画波普通用按钮：粗黑描边，高饱和，卡通风格 ========== */
.diff-btn{
    padding: 10px 18px;
    border: 3px solid #000;
    background: #2288ff;
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: transform 0.15s ease;
    box-shadow: 4px 4px 0 #000;
    position: relative;
    overflow: hidden;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.diff-btn:hover{
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 #000;
}
.diff-btn:active{
    transform: translate(2px,2px);
    box-shadow: 2px 2px 0 #000;
}
.diff-btn.active{
    background: #ff2266;
    color: #fff;
}
.diff-btn.fate.active{
    background: #aa33ff;
    color: #fff;
}
/* ========== 重置按钮 波普 ========== */
.reset-btn{
    padding: 11px 22px;
    border:3px solid #000;
    background: #ff3355;
    color:#fff;
    border-radius:4px;
    cursor: pointer;
    font-weight:bold;
    font-size:14px;
    box-shadow:4px 4px 0 #000;
    transition: transform 0.15s ease;
    text-transform: uppercase;
    letter-spacing:1px;
}
.reset-btn:hover{
    transform: translate(-2px,-2px);
    box-shadow:6px 6px 0 #000;
}
.reset-btn:active{
    transform: translate(2px,2px);
    box-shadow:2px 2px 0 #000;
}
/* ========== 主抽取大按钮 波普漫画 ========== */
#spinBtn{
    margin-top: 32px;
    padding: 18px 70px;
    font-size: 22px;
    font-weight: 900;
    background: #00dd77;
    color:#000;
    border: 4px solid #000;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 6px 6px 0 #000;
    transition: transform 0.15s ease;
    text-transform: uppercase;
    letter-spacing: 2px;
}
#spinBtn:hover{
    transform: translate(-3px,-3px);
    box-shadow:9px 9px 0 #000;
}
#spinBtn:active{
    transform: translate(3px,3px);
    box-shadow:3px 3px 0 #000;
}
#spinBtn:disabled{
    background:#999;
    color:#444;
    cursor: not-allowed;
    transform:none;
    box-shadow:4px 4px 0 #000;
}
/* ========== 复制截图按钮波普 ========== */
#copyImageBtn{
    margin-top:14px;
    padding:11px 24px;
    border:3px solid #000;
    background:#ffcc00;
    color:#000;
    font-weight:bold;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    box-shadow:4px 4px 0 #000;
    transition: transform 0.15s ease;
}
#copyImageBtn:hover:not(:disabled){
    transform: translate(-2px,-2px);
    box-shadow:6px 6px 0 #000;
}
#copyImageBtn:disabled{
    opacity:0.4;
    cursor:not-allowed;
    transform:none;
    box-shadow:4px 4px 0 #000;
}
#copyTip{
    margin-top:8px;
    font-size:14px;
    color:#fff;
    min-height:20px;
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
}
/* ========== 配置面板波普漫画风：粗黑边框，明亮底色，漫画阴影 ========== */
.config-panel{
    width: 680px;
    max-width: 100%;
    background: #fff;
    border:4px solid #000;
    box-shadow: 8px 8px 0 #000;
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 24px;
}
.config-section{
    margin-bottom: 18px;
}
.config-section:last-child{
    margin-bottom: 0;
}
.config-title{
    color:#ff2255;
    font-size:16px;
    font-weight:900;
    margin-bottom:12px;
    display: flex;
    align-items: center;
    gap:6px;
}
.check-group{
    display: flex;
    flex-wrap: wrap;
    gap:12px 18px;
}
.check-item{
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    font-size:14px;
    color:#222;
    user-select: none;
    font-weight:bold;
}
.check-item input{
    cursor: pointer;
    width:18px;height:18px;
}
.check-item:hover{
    color:#2266ff;
}
.map-sublist{
    margin-top: 8px;
    padding-left: 10px;
    border-left:3px solid #000;
    display: none;
}
.map-sublist.show{
    display: block;
}
.control-box{
    display:flex;
    gap:14px;
    margin-bottom:24px;
    flex-wrap:wrap;
    justify-content:center;
}
/* ========== 开箱滚动区 波普漫画改造 ========== */
.case-wrap{
    position: relative;
    width: 640px;
    max-width: 100%;
}
.case-container{
    width:100%;
    height:130px;
    background:#ffffff;
    border:4px solid #000;
    border-radius:6px;
    overflow:hidden;
    position:relative;
    box-shadow: 6px 6px 0 #000;
}
.case-track{
    height:100%;
    display:flex;
    align-items:center;
    will-change: transform;
}
.case-item{
    flex-shrink:0;
    width:134px;
    height:96px;
    margin:0 6px;
    background:#00bbff;
    border:3px solid #000;
    border-radius:4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:13px;
    font-weight:900;
    color:#000;
    padding:0 6px;
    line-height:1.3;
    word-break:break-all;
    box-shadow:3px 3px 0 #000;
}
.case-item .sub{
    font-size:11px;
    color:#222;
    font-weight:bold;
    margin-top:3px;
}
.case-item:nth-child(even){
    background:#ffdd22;
}
/* 中间瞄准指示器波普漫画 */
.case-indicator{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    transform: translateX(-50%);
    width:6px;
    background:#ff2266;
    box-shadow:0 0 0 2px #000;
    z-index:10;
    pointer-events:none;
}
.case-indicator::before,
.case-indicator::after{
    content: '';
    position:absolute;
    left:50%;
    transform: translateX(-50%);
    border-left:12px solid transparent;
    border-right:12px solid transparent;
}
.case-indicator::before{
    top:-4px;
    border-top:18px solid #ff2266;
    filter: drop-shadow(0 2px 0 #000);
}
.case-indicator::after{
    bottom:-4px;
    border-bottom:18px solid #ff2266;
    filter: drop-shadow(0 2px 0 #000);
}
.result{
    margin-top:26px;
    font-size:26px;
    color:#ff4477;
    font-weight:900;
    min-height:34px;
    text-align:center;
    text-shadow:2px 2px 0 #000;
}
.record{
    margin-top:22px;
    padding:28px 24px;
    border:4px solid #000;
    border-radius:6px;
    width:640px;
    max-width:100%;
    background:#fff;
    box-shadow:8px 8px 0 #000;
}
.record h3{
    color:#2244ff;
    font-size:23px;
    margin-bottom:16px;
    font-weight:900;
}
.record p{
    font-size:19px;
    color:#111;
    line-height:2.5;
    font-weight:bold;
}
.tips{
    margin-top:16px;
    color:#ffffff;
    font-size:14px;
    text-align:center;
    max-width:640px;
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
}
@media(max-width:650px){
    .case-container{height:110px;}
    .case-item{
        width:108px;
        height:80px;
        font-size:12px;
    }
    h1 span{
        font-size: clamp(16px,3vw,36px);
    }
    .config-panel{padding:16px;}
    #spinBtn{padding:15px 40px;font-size:18px;}
    .record{padding:20px 16px;}
    .record h3{font-size:20px;}
    .record p{font-size:16px;line-height:2.2;}
    .result{font-size:21px;}
}
</style>
</head>

    <!-- 新增：武器分类选择【改为多选按钮】 -->

        <div class="diff-group">

            <button class="diff-btn weapon-cat-btn" data-weapcat="smg">冲锋枪</button>
            <button class="diff-btn weapon-cat-btn" data-weapcat="shotgun">霰弹枪</button>
            <button class="diff-btn weapon-cat-btn" data-weapcat="sniper">狙击</button>
            <button class="diff-btn weapon-cat-btn" data-weapcat="lmg">机枪</button>
            <button class="diff-btn weapon-cat-btn" data-weapcat="pistol">手枪</button>
            <button class="diff-btn fate" id="weapAllToggle">🎲命运(交给命运)</button>
        </div>
    </div>
    <div class="config-section">
        <div class="config-title">🛡️ 头盔护甲品级</div>
        <div class="diff-group">
            <button class="diff-btn" data-armor="easy">初级(1~3级)</button>
            <button class="diff-btn" data-armor="mid">中级(3~4级)</button>
            <button class="diff-btn" data-armor="hard">高级(3~5级)</button>
            <button class="diff-btn fate active" data-armor="fate">🎲 命运(交给命运)</button>
        </div>
    </div>
    <div class="config-section" id="mapConfigSection" style="display:none;">
        <div class="config-title">🗺️ 地图池（勾选参与抽取的地图）</div>
        <div class="check-group">
            <label class="check-item"><input type="checkbox" class="map-check" value="零号大坝" checked> 零号大坝</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="长弓溪谷" checked> 长弓溪谷</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="巴克什" checked> 巴克什</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="航天基地" checked> 航天基地</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="潮汐监狱" checked> 潮汐监狱</label>
            <label class="check-item"><input type="checkbox" class="map-check" value="AZ3核电站" checked> AZ3核电站</label>
        </div>
        <div class="config-title" style="margin-top:10px; font-size:13px;">地图难度模式</div>
        <div class="diff-group">
            <button class="diff-btn active" data-mapdiff="secret">机密模式</button>
            <button class="diff-btn" data-mapdiff="top">绝密模式</button>
            <button class="diff-btn fate" data-mapdiff="mapfate">🎲命运(交给命运)</button>
        </div>
    </div>
</div>
<div class="control-box">
    <button class="reset-btn" id="resetBtn">重置重来</button>
</div>
<!-- 开箱滚动区 -->
<div class="case-wrap">
    <div class="case-container">
        <div class="case-track" id="caseTrack"></div>
    </div>
    <div class="case-indicator"></div>
</div>
<button id="spinBtn">开始抽取</button>
<div class="result" id="resText"></div>
<div class="record" id="recordWrap">
    <h3>📋 本局抽取结果</h3>

<button id="copyImageBtn" disabled>生成结果图片并复制到剪贴板</button>
<div id="copyTip"></div>

// ========= 截图复制图片到剪贴板功能 =========
async function copyResultImage(){
    copyTip.innerText = "正在生成图片...";
    try{
        const canvas = await html2canvas(recordWrap,{
            backgroundColor:"#ffffff",
            scale:2
        });
        // 转blob
        const blob = await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
        const item = new ClipboardItem({ "image/png": blob });
        await navigator.clipboard.write([item]);
        copyTip.innerText = "✅图片已复制到剪贴板！可以直接粘贴";
    }catch(err){
        console.error(err);
        copyTip.innerText = "❌复制失败，正在下载图片";
        // 降级下载
        const a = document.createElement("a");
        a.download = "三角洲抽取结果_波普版.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
    }
}

// ===================== 工具函数 =====================
function shuffleArray(arr) {
    const newArr = [...arr];
    for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
    }
    return newArr;
}
// =========重写加权随机函数，读取ALL_ITEM_WEIGHTS=========
function weightedRandom(pool, lastItemKey){
    const weights = pool.map((item) => {
        // 优先读取全局权重表，没有定义默认1
        let w = ALL_ITEM_WEIGHTS[item.text] ?? 1;
        // 如果上一轮抽过这个物品，施加重复惩罚
        if(lastResult[lastItemKey] === item.text){
            w *= DRAW_CONFIG.repeatPenalty;
        }
        return w;
    });
    const totalWeight = weights.reduce((sum, w) => sum + w, 0);
    let random = Math.random() * totalWeight;
    for(let i = 0; i < weights.length; i++){
        random -= weights[i];
        if(random <= 0){
            return i;
        }
    }
    return pool.length - 1;
}
function buildQueue(){
    const queue = [];
    const weaponChecked = document.getElementById('chk-weapon').checked;
    const dualGun = document.getElementById('chk-dualGun').checked;
    dualGunExcludeCat = null;
    if(weaponChecked){
        if(dualGun){
            queue.push({key:'weapon1', label:'武器①', isDualFirst:true});
            queue.push({key:'weapon2', label:'武器②', isDualSecond:true});
        }else{
            queue.push({key:'weapon', label:'武器'});
        }
    }
    if(document.getElementById('chk-helmet').checked) queue.push({key:'helmet', label:'头盔'});
    if(document.getElementById('chk-armor').checked) queue.push({key:'armor', label:'护甲'});
    if(document.getElementById('chk-operator').checked) queue.push({key:'operator', label:'干员'});
    if(document.getElementById('chk-map').checked) queue.push({key:'map', label:'地图'});
    return queue;
}
function getCurrentPool(){
    const current = spinQueue[spinIndex];
    if(!current) return [];
    switch(current.key){
        case 'weapon':
        case 'weapon1':
        case 'weapon2': {
            let wList = [...weaponList];
            if(document.getElementById('chk-weapon-extra').checked){
                wList = wList.concat(extraWeaponList);
            }
            wList = wList.filter(w=> selectedWeaponCats.includes(w.category));
            if(current.isDualSecond && dualGunExcludeCat){
                wList = wList.filter(w=> w.category !== dualGunExcludeCat);
            }
            return wList.map(w => ({text: w.name, sub: '', category: w.category}));
        }
        case 'helmet':
            return helmetPool[armorMode].map(name => ({text: name, sub: ''}));
        case 'armor':
            return armorPool[armorMode].map(name => ({text: name, sub: ''}));
        case 'operator':
            return operatorList.map(op => ({text: op.name, sub: op.sub}));
        case 'map':{
            const checkedMapNames = [];
            document.querySelectorAll('.map-check:checked').forEach(cb=>{
                checkedMapNames.push(cb.value);
            });
            const mapPool = [];
            if(mapDiffMode === "mapfate"){
                for(const m of mapSourcePool.secret){
                    if(checkedMapNames.includes(m)) mapPool.push({text: `${m}-机密`, sub:""});
                }
                for(const m of mapSourcePool.top){
                    if(checkedMapNames.includes(m)) mapPool.push({text: `${m}-绝密`, sub:""});
                }
            }else{
                for(const m of mapSourcePool[mapDiffMode]){
                    if(checkedMapNames.includes(m)) mapPool.push({text: m, sub: mapDiffText[mapDiffMode] + '模式'});
                }
            }
            return mapPool;
        }
    }
    return [];
}
function buildTrack(pool){
    caseTrack.innerHTML = '';
    for(let r = 0; r < REPEAT_COUNT; r++){
        pool.forEach(item => {
            const div = document.createElement('div');
            div.className = 'case-item';
            div.innerHTML = item.text + (item.sub ? `<div class="sub">${item.sub}</div>` : '');
            caseTrack.appendChild(div);
        });
    }
}
function updateRecord(){
    const lines = [];
    spinQueue.forEach(q=>{
        const val = resultSet[q.key + '_' + q.label] || '待抽取';
        lines.push(`${q.label}：${val}`);
    });
    recordText.innerHTML = lines.join('<br>');
    // 判断是否有真正结果，启用截图按钮
    const hasResult = Object.values(resultSet).some(v=>v && v!=='待抽取');
    copyImageBtn.disabled = !hasResult;
    if(!hasResult){
        copyTip.innerText = "";
    }
}
function resetAll(){
    spinQueue = buildQueue();
    spinIndex = 0;
    resultSet = {};
    resText.innerText = "";
    copyTip.innerText = "";
    const dualGun = document.getElementById('chk-dualGun').checked;
    if(dualGun && selectedWeaponCats.length < 2){
        spinBtn.innerText = "⚠️双枪模式需要至少勾选2个武器分类";
        spinBtn.disabled = true;
    }else if(spinQueue.length === 0){
        spinBtn.innerText = "请至少勾选一项";
        spinBtn.disabled = true;
    }else{
        spinBtn.innerText = `开始抽取（共${spinQueue.length}项）`;
        spinBtn.disabled = false;
    }
    const pool = shuffleArray(getCurrentPool());
    if(pool.length > 0) buildTrack(pool);
    caseTrack.style.transition = 'none';
    caseTrack.style.transform = 'translateX(0)';
    updateRecord();
    syncFateBtnState();
}
resetBtn.onclick = function(){
    if(isSpinning) return;
    resetAll();
};
['chk-weapon','chk-dualGun','chk-weapon-extra','chk-helmet','chk-armor','chk-operator','chk-map'].forEach(id=>{
    document.getElementById(id).addEventListener('change', ()=>{
        if(!isSpinning) resetAll();
    });
});
document.querySelectorAll('.map-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
        if(!isSpinning) resetAll();
    });
});
function runSpin(){
    if(isSpinning) return;
    if(spinQueue.length === 0) return;
    if(spinIndex >= spinQueue.length){
        resetAll();
        return;
    }
    const current = spinQueue[spinIndex];
    let pool = getCurrentPool();
    if(pool.length === 0){
        if(current.isDualSecond){
            resText.innerText = "⚠️双枪模式：剩余可选武器分类为空，请多选几类武器！";
        }else{
            resText.innerText = "⚠️ 当前选中分类没有可用物品，请重新选择武器分类！";
        }
        spinIndex++;
        if(spinIndex >= spinQueue.length){
            finishAll();
        }else{
            runSpin();
        }
        return;
    }
    // 单次抽取只shuffle一次！pool数组，buildTrack和加权随机共用同一个数组！保证DOM顺序和数组顺序严格对应
    pool = shuffleArray(pool);
    resText.innerText = `正在抽取${current.label}...`;
    isSpinning = true;
    spinBtn.disabled = true;
    buildTrack(pool);
    caseTrack.style.transition = 'none';
    caseTrack.style.transform = 'translateX(0)';
    caseTrack.offsetHeight;
    // 加权随机，使用当前pool数组
    const winIndex = weightedRandom(pool, current.key);
    const winItem = pool[winIndex];
    // 修正item宽度计算，包含左右margin 6px+6px
    const itemEl = caseTrack.querySelector('.case-item');
    const itemWidthFull = itemEl.offsetWidth + 12; // width + margin-left + margin-right
    const containerWidth = caseTrack.parentElement.clientWidth;
    const centerOffset = containerWidth / 2 - itemWidthFull / 2;
    // 选择靠后副本，防止滚动到最开头
    const copyIndex = REPEAT_COUNT - 3;
    const globalWinIndex = copyIndex * pool.length + winIndex;
    const targetX = -(globalWinIndex * itemWidthFull - centerOffset);
    caseTrack.style.transition = `transform ${ANIM_DURATION}ms ${EASING}`;
    requestAnimationFrame(()=>{
        caseTrack.style.transform = `translateX(${targetX}px)`;
    });
    setTimeout(()=>{
        // 动画结束：读取瞄准位置的DOM，做校验兜底，防止视觉和逻辑不一致
        const itemsDom = Array.from(caseTrack.querySelectorAll('.case-item'));
        const finalWinDom = itemsDom[globalWinIndex];
        let finalText = winItem.text;
        let finalSub = winItem.sub;
        if(finalWinDom){
            const domText = finalWinDom.innerText.replace(/\n.*/,"").trim();
            // 兜底校验，如果DOM展示文本和逻辑选中不一致，以DOM展示为准
            if(domText && domText !== winItem.text){
                const findIdx = pool.findIndex(p=>p.text === domText);
                if(findIdx >= 0){
                    finalText = pool[findIdx].text;
                    finalSub = pool[findIdx].sub;
                }
            }
        }
        const winText = finalText + (finalSub ? `（${finalSub}）` : '');
        resultSet[current.key + '_' + current.label] = winText;
        if(current.isDualFirst){
            dualGunExcludeCat = winItem.category;
        }
        lastResult[current.key] = finalText;
        spinIndex++;
        updateRecord();
        if(spinIndex < spinQueue.length){
            const next = spinQueue[spinIndex];
            resText.innerText = `✅${current.label}抽到：${winText}，点击继续抽取${next.label}`;
            spinBtn.innerText = `抽取${next.label}`;
        }else{
            finishAll(winText, current.label);
        }
        isSpinning = false;
        spinBtn.disabled = false;
    }, ANIM_DURATION);
}
function finishAll(lastItem='', lastLabel=''){
    if(lastItem){
        resText.innerText = `🎉全部抽取完成！${lastLabel}：${lastItem}，点击重新抽取`;
    }else{
        resText.innerText = `🎉全部抽取完成！点击重新抽取`;
    }
    spinBtn.innerText = "重新抽取";
}
spinBtn.addEventListener('click', runSpin);
resetAll();
