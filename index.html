<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>三角洲行动全能抽取器 - 开箱滚动版</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: #12161c;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 15px;
}
h1{
    color: #ffc241;
    margin-bottom: 16px;
    font-size: 24px;
    text-shadow: 0 0 8px #ffc24155;
    text-align:center;
}

/* ========== 配置面板 ========== */
.config-panel{
    width: 680px;
    max-width: 100%;
    background: #1a1f27;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
}
.config-section{
    margin-bottom: 14px;
}
.config-section:last-child{
    margin-bottom: 0;
}
.config-title{
    color: #ffc241;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.check-group{
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
}
.check-item{
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    font-size: 14px;
    color: #ddd;
    user-select: none;
}
.check-item input{
    cursor: pointer;
    accent-color: #ffc241;
}
.check-item:hover{
    color: #ffc241;
}

/* 难度选择 */
.diff-group{
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.diff-btn{
    padding: 6px 12px;
    border: 1px solid #444;
    background: #222831;
    color: #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
}
.diff-btn.active{
    background: linear-gradient(135deg,#ffc241,#ff9f1a);
    color: #111;
    border-color: #ffc241;
    font-weight: bold;
}
.diff-btn.fate.active{
    background: linear-gradient(135deg,#a855f7,#ec4899);
    color: #fff;
    border-color: #a855f7;
}

/* 地图子选项 */
.map-sublist{
    margin-top: 8px;
    padding-left: 8px;
    border-left: 2px solid #333;
    display: none;
}
.map-sublist.show{
    display: block;
}

.control-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
    justify-content:center;
}
.reset-btn{
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
    font-size:14px;
    background:#c0392b;
    color:#fff;
}

/* ========== 开箱滚动核心 ========== */
.case-wrap{
    position: relative;
    width: 620px;
    max-width: 100%;
}
.case-container{
    width: 100%;
    height: 120px;
    background: #1a1f27;
    border: 2px solid #333;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 20px #0008;
}
.case-track{
    height: 100%;
    display: flex;
    align-items: center;
    will-change: transform;
}
.case-item{
    flex-shrink: 0;
    width: 130px;
    height: 90px;
    margin: 0 5px;
    background: #222831;
    border: 1px solid #444;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    color: #eee;
    padding: 0 6px;
    line-height: 1.3;
    word-break: break-all;
}
.case-item .sub{
    font-size: 11px;
    color: #aaa;
    font-weight: normal;
    margin-top: 2px;
}
.case-item:nth-child(even){
    background: #2a313c;
}

/* 中间瞄准线 */
.case-indicator{
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    background: #ffc241;
    box-shadow: 0 0 10px #ffc241;
    z-index: 10;
    pointer-events: none;
}
.case-indicator::before,
.case-indicator::after{
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
}
.case-indicator::before{
    top: -2px;
    border-top: 14px solid #ffc241;
}
.case-indicator::after{
    bottom: -2px;
    border-bottom: 14px solid #ffc241;
}

#spinBtn{
    margin-top:30px;
    padding:14px 48px;
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(135deg,#ffc241,#ff9f1a);
    color:#111;
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 4px 12px #ffc24144;
    transition:0.2s;
}
#spinBtn:active{transform:scale(0.96);}
#spinBtn:disabled{
    background:#444;
    color:#888;
    cursor:not-allowed;
    box-shadow:none;
    transform:none;
}
.result{
    margin-top:20px;
    font-size:18px;
    color:#ffc241;
    min-height:28px;
    text-align:center;
}
.record{
    margin-top:16px;
    padding:14px 16px;
    border:1px solid #444;
    border-radius:8px;
    width: 620px;
    max-width: 100%;
}
.record h3{
    color:#ffc241;
    font-size:16px;
    margin-bottom:10px;
}
.record p{
    font-size:14px;
    color:#ddd;
    line-height: 2;
}
.tips{
    margin-top:12px;
    color:#aaa;
    font-size:13px;
    text-align:center;
    max-width:620px;
}

@media(max-width:650px){
    .case-container{height: 100px;}
    .case-item{
        width: 105px;
        height: 76px;
        font-size: 12px;
    }
    h1{font-size:20px;}
    .config-panel{padding: 12px;}
}
</style>

// ===================== 工具函数 =====================

// Fisher-Yates 数组洗牌：随机打乱数组顺序，返回新数组
function shuffleArray(arr) {
    const newArr = [...arr];
    for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
    }
    return newArr;
}

// 从头甲名称中提取装备等级
function getItemLevel(name){
    const match = name.match(/\((\d)级\)/);
    return match ? parseInt(match[1]) : 3;
}

// 加权随机抽取：支持品级/分类权重 + 历史重复惩罚
function weightedRandom(pool, category){
    const weights = pool.map((item) => {
        let weight = 1;
        
        // 头盔/护甲按品级分配权重
        if(category === 'helmet' || category === 'armor'){
            const level = getItemLevel(item.text);
            weight = DRAW_CONFIG.armorLevelWeight[level] || 1;
        }
        
        // 武器按分类分配权重
        if(category === 'weapon'){
            weight = DRAW_CONFIG.weaponCategoryWeight[item.category] || 1;
        }
        
        // 上一次抽中的物品，按惩罚系数降低权重
        if(lastResult[category] === item.text){
            weight *= DRAW_CONFIG.repeatPenalty;
        }
        
        return weight;
    });
    
    const totalWeight = weights.reduce((sum, w) => sum + w, 0);
    let random = Math.random() * totalWeight;
    
    for(let i = 0; i < weights.length; i++){
        random -= weights[i];
        if(random <= 0){
            return i;
        }
    }
    return pool.length - 1;
}

    if(document.getElementById('chk-armor').checked) queue.push({key:'armor', label:'护甲'});
    if(document.getElementById('chk-operator').checked) queue.push({key:'operator', label:'干员'});
    if(document.getElementById('chk-map').checked) queue.push({key:'map', label:'地图'});
    return queue;
}

// 获取当前步骤的物品池
function getCurrentPool(){
    const current = spinQueue[spinIndex];
    if(!current) return [];

    switch(current.key){
        case 'weapon': 
            return weaponList.map(w => ({text: w.name, sub: '', category: w.category}));
        case 'helmet': 
            return helmetPool[armorMode].map(name => ({text: name, sub: ''}));
        case 'armor': 
            return armorPool[armorMode].map(name => ({text: name, sub: ''}));
        case 'operator': 
            return operatorList.map(op => ({text: op.name, sub: op.sub}));
        case 'map':
            const checked = [];
            document.querySelectorAll('.map-check:checked').forEach(cb=>{
                checked.push({text: cb.value, sub: mapDiffText[mapDiffMode] + '模式'});
            });
            return checked;
    }
    return [];
}

// 生成滚动轨道
function buildTrack(pool){
    caseTrack.innerHTML = '';
    for(let r = 0; r < REPEAT_COUNT; r++){
        pool.forEach(item => {
            const div = document.createElement('div');
            div.className = 'case-item';
            div.innerHTML = item.text + (item.sub ? `<div class="sub">${item.sub}</div>` : '');
            caseTrack.appendChild(div);
        });
    }
}

// 更新记录面板
function updateRecord(){
    const lines = [];
    const labelMap = {weapon:'武器', helmet:'头盔', armor:'护甲', operator:'干员', map:'地图'};
    spinQueue.forEach(q=>{
        const val = resultSet[q.key] || '待抽取';
        lines.push(`${labelMap[q.key]}：${val}`);
    });
    recordText.innerHTML = lines.join('<br>');
}

// 重置
function resetAll(){
    spinQueue = buildQueue();
    spinIndex = 0;
    resultSet = {};
    resText.innerText = "";
    
    if(spinQueue.length === 0){
        spinBtn.innerText = "请至少勾选一项";
        spinBtn.disabled = true;
    }else{
        spinBtn.innerText = `开始抽取（共${spinQueue.length}项）`;
        spinBtn.disabled = false;
    }
    
    const pool = shuffleArray(getCurrentPool());
    if(pool.length > 0) buildTrack(pool);
    caseTrack.style.transition = 'none';
    caseTrack.style.transform = 'translateX(0)';
    updateRecord();
}

// ===================== 事件绑定 =====================
resetBtn.onclick = function(){
    if(isSpinning) return;
    resetAll();
};

['chk-weapon','chk-helmet','chk-armor','chk-operator','chk-map'].forEach(id=>{
    document.getElementById(id).addEventListener('change', ()=>{
        if(!isSpinning) resetAll();
    });
});
document.querySelectorAll('.map-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
        if(!isSpinning) resetAll();
    });
});

// ===================== 核心滚动抽奖 =====================
function runSpin(){
    if(isSpinning) return;
    if(spinQueue.length === 0) return;

    if(spinIndex >= spinQueue.length){
        resetAll();
        return;
    }

    // 每次抽取前打乱物品池顺序
    const pool = shuffleArray(getCurrentPool());
    if(pool.length === 0){
        spinIndex++;
        if(spinIndex >= spinQueue.length){
            finishAll();
        }else{
            runSpin();
        }
        return;
    }

    const current = spinQueue[spinIndex];
    resText.innerText = `正在抽取${current.label}...`;

    isSpinning = true;
    spinBtn.disabled = true;

    buildTrack(pool);
    caseTrack.style.transition = 'none';
    caseTrack.style.transform = 'translateX(0)';
    caseTrack.offsetHeight;

    // 使用加权随机生成中奖索引
    const winIndex = weightedRandom(pool, current.key);
    const winItem = pool[winIndex];

    const itemEl = caseTrack.querySelector('.case-item');
    const itemWidth = itemEl.offsetWidth + 10;
    const containerWidth = caseTrack.parentElement.clientWidth;
    const centerOffset = containerWidth / 2 - itemWidth / 2;

    const globalWinIndex = (REPEAT_COUNT - 3) * pool.length + winIndex;
    const targetX = -(globalWinIndex * itemWidth - centerOffset);

    caseTrack.style.transition = `transform ${ANIM_DURATION}ms ${EASING}`;
    requestAnimationFrame(()=>{
        caseTrack.style.transform = `translateX(${targetX}px)`;
    });

    setTimeout(()=>{
        const winText = winItem.text + (winItem.sub ? `（${winItem.sub}）` : '');
        resultSet[current.key] = winText;
        // 记录本次结果，用于下一次抽取的重复惩罚
        lastResult[current.key] = winItem.text;

        spinIndex++;
        updateRecord();

        if(spinIndex < spinQueue.length){
            const next = spinQueue[spinIndex];
            resText.innerText = `✅${current.label}抽到：${winText}，点击继续抽取${next.label}`;
            spinBtn.innerText = `抽取${next.label}`;
        }else{
            finishAll(winText, current.label);
        }

        isSpinning = false;
        spinBtn.disabled = false;
    }, ANIM_DURATION);
}

function finishAll(lastItem='', lastLabel=''){
    if(lastItem){
        resText.innerText = `🎉全部抽取完成！${lastLabel}：${lastItem}，点击重新抽取`;
    }else{
        resText.innerText = `🎉全部抽取完成！点击重新抽取`;
    }
    spinBtn.innerText = "重新抽取";
}

spinBtn.addEventListener('click', runSpin);

// 初始化
resetAll();
</script>

</html>
